<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-900 to-pink-900">
  <form method="POST" action="/admin/auth" class="bg-white/10 backdrop-blur-lg p-8 rounded-2xl shadow-2xl w-96">
    <h2 class="text-3xl font-bold mb-6 text-center text-white">Admin Login</h2>
    <input type="text" name="username" placeholder="Username" class="w-full p-3 mb-4 rounded-lg bg-white/20 text-white placeholder-gray-300" required />
    <input type="password" name="password" placeholder="Password" class="w-full p-3 mb-6 rounded-lg bg-white/20 text-white placeholder-gray-300" required />
    <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-purple-600 rounded-lg font-bold text-lg">Login</button>
  </form>
</body>
</html>
