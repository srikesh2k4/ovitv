<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 p-8">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-4xl font-bold mb-8">Admin Dashboard</h1>
    
    <div class="bg-white p-6 rounded-lg shadow mb-8">
      <h2 class="text-2xl font-semibold mb-4">Reports</h2>
      <table class="w-full table-auto">
        <thead class="bg-gray-200">
          <tr>
            <th class="p-2">From</th>
            <th class="p-2">To</th>
            <th class="p-2">Reason</th>
            <th class="p-2">Time</th>
          </tr>
        </thead>
        <tbody>
          {{ range .Reports }}
          <tr>
            <td class="p-2 border">{{ .ReporterIP }}</td>
            <td class="p-2 border">{{ .ReportedIP }}</td>
            <td class="p-2 border">{{ .Reason }}</td>
            <td class="p-2 border">{{ .Timestamp }}</td>
          </tr>
          {{ end }}
        </tbody>
      </table>
    </div>

    <div class="bg-white p-6 rounded-lg shadow">
      <h2 class="text-2xl font-semibold mb-4">Banned IPs</h2>
      <form method="POST" action="/admin/ban" class="mb-4 flex gap-2">
        <input name="ip" placeholder="IP" class="border p-2 flex-1 rounded" required />
        <input name="reason" placeholder="Reason" class="border p-2 flex-1 rounded" />
        <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Ban</button>
      </form>
      <table class="w-full table-auto">
        <thead class="bg-gray-200">
          <tr>
            <th class="p-2">IP</th>
            <th class="p-2">Reason</th>
            <th class="p-2">Banned At</th>
            <th class="p-2">Action</th>
          </tr>
        </thead>
        <tbody>
          {{ range .Banned }}
          <tr>
            <td class="p-2 border">{{ .IP }}</td>
            <td class="p-2 border">{{ .Reason }}</td>
            <td class="p-2 border">{{ .BannedAt }}</td>
            <td class="p-2 border">
              <a href="/admin/unban?ip={{ .IP }}" class="text-red-600 hover:underline">Unban</a>
            </td>
          </tr>
          {{ end }}
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
